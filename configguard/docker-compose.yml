services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - frontend
      - backend
    environment:
      - NGINX_SSL_CERT_PATH=${NGINX_SSL_CERT_PATH:-/etc/nginx/ssl/cert.pem}
      - NGINX_SSL_KEY_PATH=${NGINX_SSL_KEY_PATH:-/etc/nginx/ssl/key.pem}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - frontend_net
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - backend_net
    depends_on:
      - mongodb
      - redis
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-8h}
      - AGENT_TOKEN_EXPIRY=${AGENT_TOKEN_EXPIRY:-1h}
      - MONITOR_TOOL_API_URL=${MONITOR_TOOL_API_URL}
      - MONITOR_TOOL_API_KEY=${MONITOR_TOOL_API_KEY}
      - MONITOR_TOOL_DEFAULT_CARD_ID=${MONITOR_TOOL_DEFAULT_CARD_ID}
      - MONITOR_SIGNAL_SCRIPT=${MONITOR_SIGNAL_SCRIPT}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}

  mongodb:
    image: mongo:7
    networks:
      - backend_net
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      - MONGO_INITDB_DATABASE=configguard

  redis:
    image: redis:7-alpine
    networks:
      - backend_net
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  nginx_ssl:
  baseline_store:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
