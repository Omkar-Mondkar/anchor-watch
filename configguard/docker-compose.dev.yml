services:
  nginx:
    # In dev, use a self-signed cert generated at startup
    environment:
      - NGINX_DEV_MODE=true

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./scripts:/app/scripts
    environment:
      - NODE_ENV=development
    command: npx nodemon src/app.js

  mongodb:
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=devpassword

  redis:
    ports:
      - "6379:6379"

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    networks:
      - backend_net
    depends_on:
      - mongodb
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=devpassword
      - ME_CONFIG_MONGODB_URL=mongodb://root:devpassword@mongodb:27017/
      - ME_CONFIG_BASICAUTH=false

  agent-mock:
    build:
      context: ./agent
      dockerfile: Dockerfile
    networks:
      - backend_net
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:5000/api
      - SERVER_ID=mock-agent-01
    command: python collector.py --server-id mock-agent-01 --api-url http://backend:5000/api
